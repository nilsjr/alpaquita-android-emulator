name: 'Emulator Version Fetcher'
description: >-
  Resolves the STABLE-channel Android emulator version and build id from Google's
  repository XML, then asserts that every requested API level still has a published
  google_atd x86_64 system image (system images cap lower than SDK platforms, so the
  ceiling must be checked explicitly rather than assumed).

inputs:
  api_levels:
    description: 'Comma-separated API levels to assert a google_atd x86_64 system image for (e.g. "36,34")'
    required: true

outputs:
  emulator_version:
    description: 'STABLE-channel emulator version (e.g. 37.1.11)'
    value: ${{ steps.fetch.outputs.emulator_version }}
  emulator_build_id:
    description: 'STABLE-channel emulator build id (e.g. 15917651)'
    value: ${{ steps.fetch.outputs.emulator_build_id }}

runs:
  using: 'composite'
  steps:
    - id: fetch
      shell: bash
      run: |
        result=$("${{ github.action_path }}/scripts/fetch-emulator-version.sh" "${{ inputs.api_levels }}")

        emulator_version=$(echo "$result" | cut -d' ' -f1)
        emulator_build_id=$(echo "$result" | cut -d' ' -f2)

        echo "Stable emulator version: $emulator_version (build $emulator_build_id)"
        echo "emulator_version=$emulator_version" >> "$GITHUB_OUTPUT"
        echo "emulator_build_id=$emulator_build_id" >> "$GITHUB_OUTPUT"

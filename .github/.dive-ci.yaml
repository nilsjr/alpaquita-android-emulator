rules:
  # If the efficiency is measured below X%, mark as failed.
  # Expressed as a ratio between 0-1.
  lowestEfficiency: 0.99

  # If the amount of wasted space is at least X or larger than X, mark as failed.
  # Expressed in B, KB, MB, and GB.
  # Relaxed from upstream's 1MB: a system image alone is ~1-1.5 GB, and sdkmanager's
  # own package bookkeeping (its cache/metadata files get touched across layers)
  # wastes more than 1MB of that just by existing. This does not relax the ratio
  # rules below, which are what actually catch a genuinely bloated layer.
  highestWastedBytes: 15MB

  # If the amount of wasted space makes up for X% or more of the image, mark as failed.
  # Note: the base image layer is NOT included in the total image size.
  # Expressed as a ratio between 0-1; fails if the threshold is met or crossed.
  highestUserWastedPercent: 0.01
